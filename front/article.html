<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Article | CAMA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#9e001f", "on-primary": "#ffffff", "primary-container": "#c8102e",
                    "secondary": "#006e27", "tertiary": "#745b00", "on-surface": "#1b1c1c",
                    "on-surface-variant": "#5c403f", "outline-variant": "#e5bdbb", "background": "#fbf9f8",
                    "surface": "#fbf9f8", "surface-container-low": "#f6f3f2"
            },
            "spacing": { "container-max-width": "1200px", "margin-desktop": "32px", "stack-lg": "32px", "gutter": "24px" },
            "fontFamily": { "headline-lg": ["Montserrat"], "headline-md": ["Montserrat"], "body-lg": ["Inter"], "body-md": ["Inter"], "caption": ["Inter"], "label-md": ["Inter"] },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .prose-article p { margin-bottom: 1rem; }
    </style>
<link href="site-shell.css" rel="stylesheet"/>
</head>
<body class="min-h-screen flex flex-col bg-background text-on-surface font-body-md" data-page="actualites">
<div id="site-shell-top"></div>
<main class="flex-grow py-stack-lg">
<div class="max-w-container-max-width mx-auto px-4 md:px-margin-desktop" id="article-content"></div>
</main>
<div id="site-shell-bottom"></div>
<script src="site-content.js"></script>
<script src="site-shell.js"></script>
<script>
    document.addEventListener('cama:site-shell-ready', () => CamaSiteContent.initArticlePage());
    if (document.getElementById('site-header')) CamaSiteContent.initArticlePage();
</script>
</body></html>
