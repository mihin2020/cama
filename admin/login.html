<!DOCTYPE html>
<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connexion | Back-office CAMA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = { darkMode: "class", theme: { extend: {
    colors: { primary: "#9e001f", "on-primary": "#ffffff", "on-surface": "#1b1c1c", "on-surface-variant": "#5c403f", "outline-variant": "#e5bdbb", background: "#fbf9f8", surface: "#fbf9f8" },
    fontFamily: { "headline-lg": ["Montserrat"], "body-md": ["Inter"] }
} } }
</script>
<link href="admin-shell.css" rel="stylesheet"/>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen bg-surface font-body-md text-on-surface flex items-center justify-center p-4">
<div class="w-full max-w-md">
<a class="flex items-center justify-center gap-3 mb-8" href="../index.html">
<img alt="Logo CAMA" class="h-12 w-12 object-contain" src="../images/logo_cama.png"/>
<span class="text-xl font-headline-lg font-extrabold text-primary">CAMA <span class="text-sm font-normal text-on-surface-variant block text-center">Back-office</span></span>
</a>
<div class="bg-white rounded-xl border border-outline-variant shadow-sm p-6 md:p-8">
<h1 class="font-headline-lg text-xl mb-1 text-center">Connexion sécurisée</h1>
<p class="text-sm text-on-surface-variant text-center mb-6">Accès réservé aux agents CAMA</p>
<form class="space-y-4" id="login-form">
<div>
<label class="text-xs font-semibold uppercase text-on-surface-variant block mb-1">E-mail professionnel</label>
<input class="w-full px-4 py-3 text-sm border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary outline-none" id="login-email" placeholder="gestionnaire@cama.bf" required type="email" value="gestionnaire@cama.bf"/>
</div>
<div>
<label class="text-xs font-semibold uppercase text-on-surface-variant block mb-1">Mot de passe</label>
<input class="w-full px-4 py-3 text-sm border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary outline-none" id="login-password" placeholder="••••••••" required type="password" value="Demo2026!"/>
</div>
<p class="hidden text-sm text-error" id="login-error">Identifiants incorrects.</p>
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-bold text-sm hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-[20px]">login</span> Se connecter
</button>
</form>
<div class="mt-6 pt-5 border-t border-outline-variant text-xs text-on-surface-variant space-y-1">
<p class="font-semibold text-on-surface">Comptes démo :</p>
<p>gestionnaire@cama.bf · superviseur@cama.bf · admin@cama.bf</p>
<p>Mot de passe : <code class="bg-surface px-1 rounded">Demo2026!</code></p>
</div>
</div>
<p class="text-center text-xs text-on-surface-variant mt-6"><a class="text-primary hover:underline" href="../index.html">← Retour au site public</a></p>
</div>
<script src="../assure/assure-data.js"></script>
<script>
    if (CamaAssureData.getAdminSession()) {
        window.location.href = 'dashboard.html';
    }
    document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const session = CamaAssureData.loginAdmin(email, password);
        if (!session) {
            document.getElementById('login-error').classList.remove('hidden');
            return;
        }
        window.location.href = 'dashboard.html';
    });
</script>
<script src="../anchor-top.js"></script>
<script>CamaAnchorTop.init();</script>
</body></html>
