# Pile de test de charge : nginx + PHP-FPM 8.3 + PostgreSQL 17 (+ k6 à la demande).
# Depuis la racine du projet :
#   docker compose -f tests/Load/docker/docker-compose.yml up -d --build
#   docker compose -f tests/Load/docker/docker-compose.yml exec app php artisan migrate --force
#   docker compose -f tests/Load/docker/docker-compose.yml exec -e LOAD_TEST_CONFIRM=1 -e LOAD_ASSURES=50000 app php artisan db:seed --class=LoadTestSeeder --force
#   docker compose -f tests/Load/docker/docker-compose.yml run --rm k6 run /scripts/assure.js
services:
  db:
    image: postgres:17
    environment: { POSTGRES_DB: cama, POSTGRES_USER: cama, POSTGRES_PASSWORD: cama }
    command: >
      postgres -c max_connections=200 -c shared_buffers=1GB -c effective_cache_size=3GB
      -c work_mem=16MB -c maintenance_work_mem=256MB -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["54320:5432"]

  app:
    build: { context: ../../.., dockerfile: tests/Load/docker/Dockerfile }
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:Zm9yLWxvYWQtdGVzdHMtb25seS1ub3QtYS1yZWFsLWtleSE=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cama
      DB_USERNAME: cama
      DB_PASSWORD: cama
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      MAIL_MAILER: log
      PHP_FPM_CHILDREN: "16"
    depends_on: [db]

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../public:/var/www/html/public:ro
    ports: ["8080:80"]
    depends_on: [app]

  k6:
    image: grafana/k6:latest
    profiles: [tools]
    environment: { BASE_URL: "http://web", ASSURES: "50000" }
    volumes: ["..:/scripts:ro"]
    depends_on: [web]

volumes:
  pgdata:
